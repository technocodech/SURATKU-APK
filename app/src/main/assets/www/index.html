<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SURATKU — Generator Surat Serbaguna</title>
<meta name="description" content="Generator surat serbaguna: kop, template, tanda tangan, PDF, dan Word untuk instansi, organisasi, sekolah, perusahaan, dan perorangan.">
<meta name="theme-color" content="#faf9f5">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikrom.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<script>try{var t=localStorage.getItem('suratku-tema');if(t==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
</head>
<body>
<style>
#pl{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#faf9f5;transition:opacity .5s ease,visibility .5s}
:root[data-theme=dark] #pl{background:#181715}
#pl.pl-off{opacity:0;visibility:hidden;pointer-events:none}
#pl::before,#pl::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:pl-blob 6s ease-in-out infinite alternate}
#pl::before{width:320px;height:320px;background:#cfe0ff;top:12%;left:8%}
#pl::after{width:280px;height:280px;background:#ffe4b0;bottom:10%;right:8%;animation-delay:-3s}
:root[data-theme=dark] #pl::before{background:#16367a;opacity:.35}:root[data-theme=dark] #pl::after{background:#6b4a12;opacity:.3}
@keyframes pl-blob{to{transform:translate(30px,-24px) scale(1.15)}}
#pl-logo{position:relative;width:148px;height:148px;animation:pl-pop .8s cubic-bezier(.2,1.4,.4,1) both,pl-float 3.2s ease-in-out .9s infinite}
#pl-logo svg{width:100%;height:100%;display:block;filter:drop-shadow(0 18px 28px rgba(6,27,85,.32))}
@keyframes pl-pop{0%{transform:scale(.4) rotate(-10deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes pl-float{50%{transform:translateY(-9px) rotate(-1.5deg)}}
#pl .ln{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:pl-line .55s ease-out forwards}
#pl .l1{animation-delay:.7s}#pl .l2{animation-delay:.85s}#pl .l3{animation-delay:1s}#pl .gb{animation-delay:.6s}
@keyframes pl-line{to{transform:scaleX(1)}}
#pl .sig{stroke-dasharray:1;stroke-dashoffset:1;animation:pl-draw 1.5s ease-in-out 1.15s infinite}
@keyframes pl-draw{0%{stroke-dashoffset:1}60%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
#pl .pen{animation:pl-write 1.5s ease-in-out 1.15s infinite}
@keyframes pl-write{0%{transform:translate(-136px,15px)}20%{transform:translate(-91px,-10px)}40%{transform:translate(-51px,25px)}60%{transform:translate(-16px,-5px) }80%{transform:translate(14px,15px)}100%{transform:translate(64px,0)}}
#pl .sw{stroke-dasharray:1;stroke-dashoffset:1;animation:pl-draw2 .9s ease-out .5s forwards}
@keyframes pl-draw2{to{stroke-dashoffset:0}}
#pl .nm{opacity:0;animation:pl-fade .6s ease-out 1.1s forwards}
@keyframes pl-fade{to{opacity:1}}
#pl-t{position:relative;text-align:center;font:600 15px/1.2 Inter,system-ui,sans-serif;letter-spacing:.04em;color:#141413;opacity:0;animation:pl-fade .6s ease-out .9s forwards}
:root[data-theme=dark] #pl-t{color:#faf9f5}
#pl-t small{display:block;margin-top:6px;font-weight:400;font-size:12px;letter-spacing:0;color:#6c6a64}
:root[data-theme=dark] #pl-t small{color:#a09d96}
#pl-bar{position:relative;width:140px;height:4px;border-radius:4px;background:rgba(20,20,19,.1);overflow:hidden}
:root[data-theme=dark] #pl-bar{background:rgba(255,255,255,.14)}
#pl-bar i{position:absolute;top:0;bottom:0;width:45%;border-radius:4px;background:linear-gradient(90deg,#168bff,#f59e0b);animation:pl-bar 1.1s ease-in-out infinite}
@keyframes pl-bar{0%{left:-45%}100%{left:100%}}
@media(prefers-reduced-motion:reduce){#pl *,#pl::before,#pl::after,#pl-logo{animation-duration:.01s!important;animation-iteration-count:1!important}#pl .sig,#pl .sw{stroke-dashoffset:0}#pl .ln{transform:none}#pl .nm,#pl-t{opacity:1}}
</style>
<div id="pl" role="status" aria-label="Memuat SURATKU">
  <div id="pl-logo"><svg viewBox="0 0 512 512" aria-hidden="true">
    <defs>
      <linearGradient id="pl-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#168BFF"/><stop offset="50%" stop-color="#0646B5"/><stop offset="100%" stop-color="#061B55"/></linearGradient>
      <linearGradient id="pl-paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#DCE8FF"/></linearGradient>
      <linearGradient id="pl-gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFD76A"/><stop offset="100%" stop-color="#F59E0B"/></linearGradient>
      <filter id="pl-sh"><feGaussianBlur stdDeviation="9"/></filter>
    </defs>
    <rect width="512" height="512" rx="110" fill="url(#pl-bg)"/>
    <circle cx="430" cy="75" r="100" fill="#FFFFFF" opacity=".06"/>
    <rect x="100" y="83" width="290" height="340" rx="25" fill="#00133D" opacity=".3" filter="url(#pl-sh)"/>
    <path d="M115 85 Q115 65 140 65 H320 L400 145 V405 Q400 425 380 425 H135 Q115 425 115 405 Z" fill="url(#pl-paper)"/>
    <path d="M320 65 L400 145 H340 Q320 145 320 125 Z" fill="#FFFFFF"/>
    <text x="145" y="190" font-family="Arial,sans-serif" font-size="76" font-weight="900" fill="#092D70">IK</text>
    <rect class="ln gb" x="145" y="210" width="75" height="7" rx="4" fill="url(#pl-gold)"/>
    <g fill="#9CB3D8"><rect class="ln l1" x="145" y="245" width="210" height="11" rx="6"/><rect class="ln l2" x="145" y="275" width="185" height="11" rx="6"/><rect class="ln l3" x="145" y="305" width="200" height="11" rx="6"/></g>
    <path class="sig" pathLength="1" d="M150 365 Q185 320 210 360 Q225 390 250 355 Q270 330 280 365 Q300 385 350 350" fill="none" stroke="#092D70" stroke-width="7" stroke-linecap="round"/>
    <g class="pen"><g transform="rotate(38 350 260)">
      <rect x="340" y="180" width="30" height="155" rx="14" fill="#08275F"/><rect x="345" y="180" width="7" height="125" rx="4" fill="#7FAFFF"/>
      <path d="M340 335 L370 335 L355 370 Z" fill="#D5E4FA"/><path d="M350 360 L360 360 L355 370 Z" fill="#F59E0B"/><rect x="338" y="215" width="34" height="9" rx="4" fill="#DCE8FF"/>
    </g></g>
    <path class="sw" pathLength="1" d="M75 390 Q160 465 310 445" fill="none" stroke="url(#pl-gold)" stroke-width="9" stroke-linecap="round"/>
    <text class="nm" x="256" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF" letter-spacing="2">IKROM MAULANA</text>
  </svg></div>
  <div id="pl-t">SURATKU<small>Menyiapkan generator surat…</small></div>
  <div id="pl-bar"><i></i></div>
</div>
<script>(function(){var p=document.getElementById('pl');if(!p)return;var seen=0;try{seen=sessionStorage.getItem('suratku.pl')}catch(e){}
if(seen){p.parentNode.removeChild(p);return}
var t0=Date.now(),done=0;function off(){if(done)return;done=1;p.className='pl-off';try{sessionStorage.setItem('suratku.pl','1')}catch(e){}setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p)},700)}
function cek(){var w=Math.max(0,2600-(Date.now()-t0));setTimeout(off,w)}
if(document.readyState==='complete')cek();else window.addEventListener('load',cek);
setTimeout(off,7000)})();</script>
<div class="shell" id="shell">
  <aside class="side" id="side" aria-label="Menu utama">
    <div class="brand"><img class="logo-mark" src="ikrom.svg" alt="" width="34" height="34"><div><b>SURATKU</b><span>Generator Surat Serbaguna</span></div></div>
    <div class="profil" id="profil"><div class="profil-av" id="profilAv">S</div><b id="profilNama">SURATKU</b><span id="profilSub">Generator Surat Serbaguna</span></div>
    <nav class="nav" id="nav" aria-label="Navigasi"></nav>
    <div class="side-f"><span class="small muted" id="orgName"></span><button class="icon-btn" id="themeBtn" type="button" aria-label="Ganti mode terang/gelap"></button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar"><button class="icon-btn" id="menuBtn" type="button" aria-label="Buka menu"></button><div class="t" id="topTitle">SURATKU</div></header>
    <main id="view" class="view" tabindex="-1"><p id="memuat" style="padding:24px;color:#8e8b82">Memuat SURATKU…</p></main>
  </div>
</div>
<div id="printRoot" aria-hidden="true"></div>
<noscript><p style="padding:20px">SURATKU memerlukan JavaScript agar dapat berjalan.</p></noscript>
<script>(function(){var err=[];window.addEventListener('error',function(e){err.push((e.message||'Galat')+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':''))});window.addEventListener('unhandledrejection',function(e){err.push(String(e.reason&&e.reason.message||e.reason))});
function bersih(){var p=[];if(window.caches)p.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}));if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}));Promise.all(p).catch(function(){}).then(function(){location.reload()})}
setTimeout(function(){var m=document.getElementById('memuat');if(!m||!m.parentNode)return;
var d=document.createElement('div');d.style.cssText='padding:24px;max-width:520px;line-height:1.6';
d.innerHTML='<b>SURATKU belum berhasil dimuat.</b><p>'+(err.length?'Galat: '+err.join('; ').replace(/</g,'&lt;'):'Berkas aplikasi masih diunduh atau tidak ditemukan. Periksa koneksi, atau pastikan folder <code>dist</code> ikut terunggah.')+'</p>';
var b=document.createElement('button');b.textContent='Bersihkan cache & muat ulang';b.style.cssText='padding:10px 16px;border-radius:8px;border:1px solid #cc785c;background:#cc785c;color:#fff;font:inherit';b.onclick=bersih;d.appendChild(b);m.parentNode.replaceChild(d,m)},8000)})()</script>
<script src="dist/app.js"></script>
</body>
</html>
